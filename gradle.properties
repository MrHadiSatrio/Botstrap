# Gradle configs
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin configs
kotlin.code.style=official
# A host cannot run the tests of every target, for example mingwX64Test on macOS.
kotlin.native.ignoreDisabledTargets=true

# Android configs
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose configs
# The Compose plugin refuses a macOS native target without this flag.
org.jetbrains.compose.experimental.macos.enabled=true

# Project configs
project.domain=com.hadisatrio
project.name=bootstrap
project.version=0.1.0-SNAPSHOT
project.sdk.android.compile=37
project.sdk.android.min=23
project.sdk.android.target=37
project.sdk.java.source=21
project.sdk.java.target=11
project.test.coverage.branch.min=0
